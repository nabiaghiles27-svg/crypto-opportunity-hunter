
name: Telegram Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram test message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          message = (
              "🚀 Crypto Opportunity Hunter\n\n"
              "✅ GitHub cloud runner is working!\n"
              "✅ Telegram connection is working!\n\n"
              "Your zero-investment automation "
              "project is officially connected."
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = json.dumps({
              "chat_id": chat_id,
              "text": message
          }).encode()

          request = urllib.request.Request(
              url,
              data=data,
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read())

          if not result.get("ok"):
              raise RuntimeError("Telegram delivery failed")

          print("Telegram message delivered successfully.")
          PY
